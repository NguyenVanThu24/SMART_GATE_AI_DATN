services:
  db:
    restart: unless-stopped
    ports: !override
      - "127.0.0.1:3307:3306"

  server:
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/health',{signal:AbortSignal.timeout(3000)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      db:
        condition: service_healthy

  frontend:
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:5173',{signal:AbortSignal.timeout(3000)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      server:
        condition: service_healthy

  mqtt:
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - "nc -z -w 3 127.0.0.1 1883"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  phpmyadmin:
    restart: unless-stopped
    ports: !override
      - "127.0.0.1:8081:80"
    healthcheck:
      test:
        - CMD
        - php
        - -r
        - "$$s=@fsockopen('127.0.0.1',80,$$e,$$m,3);exit($$s?0:1);"
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      db:
        condition: service_healthy
